name: CI

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - name: Redmi-AX3000
            config: redmi_ax3000
          - name: CMCC-RAX3000Q
            config: cmcc_rax3000q
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Install dependencies
        run: |
          sudo apt-get -qq update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Checkout
        uses: actions/checkout@v3

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure ${{ matrix.device.name }}
        run: |
          cat <<EOF | sed -E 's/^  //' >.config
            CONFIG_TARGET_qualcommax=y
            CONFIG_TARGET_qualcommax_ipq50xx=y
            CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_${{ matrix.device.config }}=y
            CONFIG_PACKAGE_luci=y
            CONFIG_ALL_KMODS=y
          EOF
          make defconfig

      - name: Download
        run: |
          make -j16 download

      - name: Build
        run: |
          echo "build threads: $(nproc)";
          make -j$(nproc) IGNORE_ERRORS=1;

      - name: Archive kmod packages and rename per-device files
        run: |
          cd bin/targets/qualcommax/ipq50xx/;
          tar -zcvf openwrt-qualcommax-ipq50xx-${{ matrix.device.name }}-kmod-packages.tar.gz packages;
          rm -rf packages;

          mv config.buildinfo config-${{ matrix.device.name }}.buildinfo;
          mv profiles.json    profiles-${{ matrix.device.name }}.json;
          mv sha256sums sha256sums-${{ matrix.device.name }}

      - name: Upload bin to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-qualcommax-ipq50xx-${{ matrix.device.name }}
          path: bin/targets/qualcommax/ipq50xx/*

  release:
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download bin from artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-qualcommax-ipq50xx-*
          merge-multiple: true
          path: bin/targets/qualcommax/ipq50xx/

      - name: Merge sha256sums
        run: |
          cd bin/targets/qualcommax/ipq50xx/
          cat sha256sums-* | sort -u -k2 > sha256sums
          rm sha256sums-*

      - name: Generate release informations
        run: |
          TIME="$(curl "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"

          TAG="ci-${GITHUB_REF_NAME}-qualcommax-ipq50xx-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          echo "TAG=$TAG" >>$GITHUB_ENV

          cat <<EOF | sed -E 's/^  //' >Release.md
            CI ${GITHUB_REF_NAME} $(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')

            # ${GITHUB_REF_NAME}

            Build time: \`$(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')\`
            Release version: ${TAG}

            ## Devices
            - Redmi AX3000 M79
            - Redmi AX3000 M81
            - CMCC RAX3000Q

            ## Sources
            $(cat bin/targets/qualcommax/ipq50xx/feeds.buildinfo | awk -F'[ ^]' '{printf "%s: `%s`\n", $2, $4}')

            ## SHA256
            $(cat bin/targets/qualcommax/ipq50xx/sha256sums | awk '{printf "%s: `%s`\n", $2, $1}' | sed -E 's/^\*//')
          EOF

          echo "NAME=$(head --line=1 Release.md)" >>$GITHUB_ENV
          tail --line=+2 Release.md >Body.md

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          body_path: Body.md
          files: |
            bin/targets/qualcommax/ipq50xx/sha256sums
            bin/targets/qualcommax/ipq50xx/*.*
